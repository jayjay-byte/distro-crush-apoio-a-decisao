<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Distro Crush</title>
    <script>
      // Aplica o tema antes da primeira renderização (evita piscar).
      // Mesma chave e regra de src/theme/ThemeProvider.tsx.
      ;(function () {
        try {
          var salvo = localStorage.getItem('distro-crush:tema')
          var escuro = salvo
            ? salvo === 'escuro'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.classList.toggle('dark', escuro)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
